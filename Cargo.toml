[package]
name = "shellpass"
version = "1.7.3"
edition = "2024"

[lib]
# cdylib is required for Android, lib is required for desktop
crate-type = ["cdylib", "lib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.102"
egui = "0.34.1"
egui_extras = { version = "0.34.1", features = ["default", "image"] }
log = "0.4.29"
winit = { version = "0.30.13", default-features = false }
pgp = "0.19.0"
serde = { version = "1.0.228", features = ["derive"] }
bson = { version = "3.1.0", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
env_logger = "0.11.10"
walkdir = "2.5.0"
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "wgpu"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["wgpu", "android-native-activity"] }
android_logger = "0.15.1"
jni = "0.22.4"
jni-min-helper = "0.4.0"
ndk-context = "0.1.1"
urlencoding = "2.1.3"

[package.metadata.android]
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
java_sources = "java"
resources = "assets"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "shellpass"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity]]
name = "java.DocTreePickerActivity"
exported = false

[[package.metadata.android.application.activity]]
name = "java.FilePickerActivity"
exported = false

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "@-:8e3zWE;z-zQmC._as\\Ei"

[package.metadata.android.application]
icon = "@mipmap/logo"

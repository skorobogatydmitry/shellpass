name: main check

on:
  push:
    branches:
      - "master"
      - "*/ci*"
  pull_request:
    branches: [ "master" ]

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --target x86_64-unknown-linux-gnu
    - name: Linux lint
      run: cargo clippy --target x86_64-unknown-linux-gnu -- -Dwarnings
    - name: Android lint
      run: cargo clippy --target armv7-linux-androideabi -- -Dwarnings
    - name: Run tests
      run: cargo test --verbose --target x86_64-unknown-linux-gnu
